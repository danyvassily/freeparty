<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="appleBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#635bff"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="appleSkinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffe8d6"/>
    </linearGradient>
    <filter id="appleSoftShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Fond Squircle iOS -->
  <rect x="0" y="0" width="180" height="180" rx="42" fill="url(#appleBgGrad)"/>

  <!-- Étoile magique sparkle -->
  <path d="M142 28 L145 36 L154 39 L145 42 L142 50 L139 42 L130 39 L139 36 Z" fill="#ffd166"/>

  <!-- Tête Kawaii -->
  <circle cx="90" cy="98" r="58" fill="url(#appleSkinGrad)" filter="url(#appleSoftShadow)"/>

  <!-- Couronne dorée -->
  <g transform="translate(90, 44) scale(1.2)">
    <path d="M-22 6 L-26 -14 L-10 -4 L0 -18 L10 -4 L26 -14 L22 6 Z" fill="#ffb703" stroke="#fb8500" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="-26" cy="-14" r="2.5" fill="#e63946"/>
    <circle cx="0" cy="-18" r="3" fill="#3a86ff"/>
    <circle cx="26" cy="-14" r="2.5" fill="#e63946"/>
  </g>

  <!-- Yeux Kawaii étincelants -->
  <!-- Oeil Gauche -->
  <g transform="translate(66, 94)">
    <ellipse cx="0" cy="0" rx="8.5" ry="11" fill="#1e1b4b"/>
    <circle cx="-3" cy="-3.5" r="3.5" fill="#ffffff"/>
    <circle cx="3" cy="4" r="1.8" fill="#ffffff"/>
  </g>

  <!-- Oeil Droit -->
  <g transform="translate(114, 94)">
    <ellipse cx="0" cy="0" rx="8.5" ry="11" fill="#1e1b4b"/>
    <circle cx="-3" cy="-3.5" r="3.5" fill="#ffffff"/>
    <circle cx="3" cy="4" r="1.8" fill="#ffffff"/>
  </g>

  <!-- Joues Roses Émues -->
  <ellipse cx="52" cy="106" rx="9" ry="5.5" fill="#ff758f" opacity="0.85"/>
  <ellipse cx="128" cy="106" rx="9" ry="5.5" fill="#ff758f" opacity="0.85"/>

  <!-- Bouche souriante avec langue -->
  <g transform="translate(90, 105)">
    <path d="M-10 0 Q0 13 10 0 Z" fill="#d90429"/>
    <path d="M-6 4 Q0 11 6 4 Z" fill="#ff758f"/>
  </g>
</svg>
