<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="60%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffe8d6"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Fond Squircle iOS -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)"/>

  <!-- Étoile magique sparkle -->
  <path d="M102 20 L104 26 L110 28 L104 30 L102 36 L100 30 L94 28 L100 26 Z" fill="#ffd166"/>

  <!-- Tête Kawaii -->
  <circle cx="64" cy="68" r="42" fill="url(#skinGrad)" filter="url(#softShadow)"/>

  <!-- Couronne dorée -->
  <g transform="translate(64, 30) scale(0.9)">
    <path d="M-22 6 L-26 -14 L-10 -4 L0 -18 L10 -4 L26 -14 L22 6 Z" fill="#ffb703" stroke="#fb8500" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="-26" cy="-14" r="2.5" fill="#e63946"/>
    <circle cx="0" cy="-18" r="3" fill="#3a86ff"/>
    <circle cx="26" cy="-14" r="2.5" fill="#e63946"/>
  </g>

  <!-- Yeux Kawaii étincelants -->
  <!-- Oeil Gauche -->
  <g transform="translate(47, 65)">
    <ellipse cx="0" cy="0" rx="6" ry="8" fill="#1e1b4b"/>
    <circle cx="-2" cy="-2.5" r="2.5" fill="#ffffff"/>
    <circle cx="2" cy="3" r="1.2" fill="#ffffff"/>
  </g>

  <!-- Oeil Droit -->
  <g transform="translate(81, 65)">
    <ellipse cx="0" cy="0" rx="6" ry="8" fill="#1e1b4b"/>
    <circle cx="-2" cy="-2.5" r="2.5" fill="#ffffff"/>
    <circle cx="2" cy="3" r="1.2" fill="#ffffff"/>
  </g>

  <!-- Joues Roses Émues -->
  <ellipse cx="38" cy="74" rx="6.5" ry="4" fill="#ff758f" opacity="0.85"/>
  <ellipse cx="90" cy="74" rx="6.5" ry="4" fill="#ff758f" opacity="0.85"/>

  <!-- Bouche souriante avec langue -->
  <g transform="translate(64, 73)">
    <path d="M-7 0 Q0 9 7 0 Z" fill="#d90429"/>
    <path d="M-4 3 Q0 8 4 3 Z" fill="#ff758f"/>
  </g>
</svg>
